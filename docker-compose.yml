# 로컬 개발용 DB. application-local.yml 의 접속 정보와 같다 (md/runtime-structure.md §2)
services:
  mysql:
    image: mysql:8.4
    container_name: fin-broker-mysql-v1
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_ROOT_HOST=%
      - MYSQL_DATABASE=fin_broker
    command: [ '--character-set-server=utf8mb4', '--collation-server=utf8mb4_general_ci' ]
    ports:
      - 3306:3306
    restart: unless-stopped
