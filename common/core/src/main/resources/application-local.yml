# 로컬 프로필. bootRun 이 켠다 (server·batch build.gradle). 비밀 값은 넣지 않는다
#   DB 는 docker-compose.yml 의 mysql 컨테이너와 같은 값
#   JWT 서명 키·개발용 백도어 이메일은 루트 secrets/application-secret.yml (gitignore) 에 둔다 (md/develop-principal.md §6)
server:
  port: 9090
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fin_broker?serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

jwt:
  cookie:
    secure: false       # local 은 http

security:
  role:
    # 운영자 화면을 로컬에서 확인할 때 내 권한을 바꾼다 (PATCH /api/v1/me/role)
    self-change-allowed: true
