/*
 * 웹 클라이언트(Vite + React). npm 빌드 결과(dist)를 server 모듈이 담아 간다 (server/build.gradle).
 *   - server bootJar: 기본으로 담는다. 빼려면 -PskipClient
 *   - server bootRun·IDE 실행: 기본으로 담지 않는다. 9090 에서 화면까지 볼 때만 -PwithClient
 * 개발 중에는 이 태스크를 쓰지 않고 client 폴더에서 `npm run dev` 를 따로 띄운다 (9091, /api 는 9090 으로 프록시).
 *
 * 주의: npm run dev 를 띄워 둔 채로 이 빌드를 돌리지 않는다.
 * 윈도우에서는 돌고 있는 vite 프로세스가 물고 있는 네이티브 파일을 npm 이 지우지 못해 node_modules 가 반쯤 깨질 수 있다.
 */
plugins {
    id 'com.github.node-gradle.node' version '7.1.0'
}

node {
    // 빌드 PC 에 Node 가 없어도 되도록 플러그인이 직접 받는다
    version = '22.13.0'
    download = true
    // npm ci 는 node_modules 를 통째로 지우고 다시 깐다. dev 서버와 겹치면 더 크게 깨지므로 install 을 쓴다
    npmInstallCommand = 'install'
}

tasks.register('npmBuild', com.github.gradle.node.npm.task.NpmTask) {
    description = 'tsc 타입 검사 후 vite 로 dist 를 만든다'
    dependsOn tasks.named('npmInstall')
    args = ['run', 'build']

    // 소스가 그대로면 Gradle 이 건너뛴다. 서버만 고쳤을 때 npm 빌드가 매번 돌지 않게 하려는 것
    inputs.dir('src')
    inputs.dir('public')
    inputs.files('index.html', 'package.json', 'package-lock.json', 'vite.config.ts',
                 'tsconfig.json', 'tsconfig.app.json', 'tsconfig.node.json')
    // Node 버전이 바뀌면 산출물도 다시 만든다
    inputs.property('nodeVersion', node.version)
    outputs.dir(layout.projectDirectory.dir('dist'))
}

tasks.register('clean', Delete) {
    delete layout.projectDirectory.dir('dist')
}
